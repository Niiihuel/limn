[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.43"
edition = "2021"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Niiihuel/limn"
readme = "README.md"
keywords = ["gui", "ui", "widgets", "components", "wgpu"]
categories = ["gui"]

# Drawing and layout pass geometry as arguments and keep commands in enums;
# splitting either into structs or boxes would cost more than it explains.
[workspace.lints.clippy]
too_many_arguments = "allow"
large_enum_variant = "allow"
type_complexity = "allow"
# A fold is one range of rows; a list holding a single fold is not a mistake.
single_range_in_vec_init = "allow"

[profile.dev]
debug = "line-tables-only"

# Dependencies are built once, so they can afford to be optimized: an
# unoptimized renderer drops frames during every animation. Workspace crates
# stay unoptimized so a hot patch still compiles in under a second.
[profile.dev.package."*"]
opt-level = 2
debug = false
