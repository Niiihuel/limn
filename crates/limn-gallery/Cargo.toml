[package]
name = "limn-gallery"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Component gallery for limn, with hot-patched views"
publish = false

[lints]
workspace = true

[features]
# Hot-patch views while running under `dx serve --hot-patch`; see `limn::hot`.
hot = ["limn/hot"]

[dependencies]
# The standard clock everywhere but a browser, where std's panics.
web-time = "1.1"
limn = { version = "0.1.39", path = "../limn", default-features = false }
limn-egui = { version = "0.1.39", path = "../limn-egui", default-features = false }
# The buffer a `CodeEditor` draws.
limn-editor = { version = "0.1.39", path = "../limn-editor" }
eframe = { version = "0.36.2", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }

# The browser build: `wasm32-unknown-unknown`, then `wasm-bindgen --target web`.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
# WebGL where the browser has no WebGPU.
wgpu = { version = "30", default-features = false, features = ["webgl", "wgsl"] }
