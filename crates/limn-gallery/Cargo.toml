[package]
name = "limn-gallery"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Component gallery for limn, with hot-patched views"
publish = false

[lints]
workspace = true

[features]
# Hot-patch views while running under `dx serve --hot-patch`.
# The crate versions must match the `dx` binary.
hot = ["dep:subsecond", "dep:dioxus-devtools"]

[dependencies]
limn = { path = "../limn", default-features = false }
limn-egui = { path = "../limn-egui", default-features = false }
eframe = { version = "0.36.2", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
subsecond = { version = "=0.7.9", optional = true }
dioxus-devtools = { version = "=0.7.9", optional = true }
