[package]
name = "limn-dnd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "File drag and drop with other applications for windows limn does not own (Wayland)"

[lints]
workspace = true

[dependencies]
raw-window-handle = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
# Bound receive-only URI pipes without making the source's writer nonblocking.
rustix = { version = "1.1.5", features = ["fs", "pipe"] }
sctk = { package = "smithay-client-toolkit", version = "0.20.0", default-features = false, features = ["calloop"] }
wayland-backend = { version = "0.3.5", default-features = false, features = ["client_system"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
# Exercise guest startup against a private protocol server, without a running compositor.
wayland-server = "0.31.14"
