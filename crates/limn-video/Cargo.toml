[package]
name = "limn-video"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Plays short muted H.264 clips on a limn-egui surface, decoded on a worker thread"

[lints]
workspace = true

[dependencies]
limn = { version = "0.1.43", path = "../limn", default-features = false }
limn-egui = { version = "0.1.43", path = "../limn-egui", default-features = false }
# The context frames are presented in: the egui that limn-egui's eframe re-exports.
egui = { version = "0.37.0", default-features = false }
# Decodes H.264 with Cisco's BSD-licensed OpenH264, compiled from the source it
# vendors by the C++ compiler `cc` finds: no system library to install.
openh264 = { version = "0.9.8", default-features = false, features = ["source"] }
# Reads the samples, timing and parameter sets of an MP4's video track.
mp4 = "0.14"
