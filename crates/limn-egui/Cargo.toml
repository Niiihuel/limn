[package]
name = "limn-egui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "egui/wgpu renderer and input adapter for limn frames"

[lints]
workspace = true

[features]
default = ["syntax"]
syntax = ["limn/syntax"]
# Hot reload under `dx serve --hot-patch`; see `limn::hot`.
hot = ["limn/hot"]

[dependencies]
limn = { version = "0.1.43", path = "../limn", default-features = false }
# `accesskit` publishes what `Frame::access` holds to the platform.
eframe = { version = "0.36.2", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland", "accesskit"] }
resvg = { version = "0.48.1", default-features = false }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
base64 = "0.22"
sha2 = "0.10"

[dev-dependencies]
limn-editor = { version = "0.1.43", path = "../limn-editor" }
# Inspect configured font charmaps: egui's has_glyph has false negatives on its replacement face.
# This parser is already used by egui; it adds no runtime dependency.
skrifa = "0.44.0"
