[package]
name = "lienzo-egui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "egui/wgpu renderer and input adapter for lienzo frames"

[features]
default = ["syntax"]
syntax = ["lienzo/syntax"]

[dependencies]
lienzo = { path = "../lienzo", default-features = false }
eframe = { version = "0.36.2", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland"] }
resvg = { version = "0.48.1", default-features = false }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
base64 = "0.22"
sha2 = "0.10"

[dev-dependencies]
lienzo-editor = { path = "../lienzo-editor" }
