[package]
name = "lienzo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Original retained-state UI tree, layout, events and backend-neutral drawing"

[features]
default = ["syntax"]
# Tree-sitter highlighting. Without it code views fall back to the line lexer.
syntax = ["dep:lienzo-language"]

[dependencies]
lienzo-editor = { path = "../lienzo-editor" }
lienzo-language = { path = "../lienzo-language", optional = true }
unicode-linebreak = "0.1.5"
unicode-segmentation = "1.12"
unicode-width = "0.2"
