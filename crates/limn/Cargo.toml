[package]
name = "limn"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Original retained-state UI tree, layout, events and backend-neutral drawing"

[lints]
workspace = true

[features]
default = ["syntax"]
# Tree-sitter highlighting. Without it code views fall back to the line lexer.
syntax = ["dep:limn-language"]

[dependencies]
# The standard clock everywhere but a browser, where std's panics.
web-time = "1.1"
limn-editor = { version = "0.1.39", path = "../limn-editor" }
limn-language = { version = "0.1.39", path = "../limn-language", optional = true }
unicode-linebreak = "0.1.5"
unicode-segmentation = "1.12"
unicode-width = "0.2"
# Parses link destinations; nothing is ever fetched.
url = "2"
