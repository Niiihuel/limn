[package]
name = "limn"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true
description = "A native UI library: the limn engine and the components that ship with it, under one name"

[lints]
workspace = true

[features]
default = ["syntax", "bundled-fonts"]
# The faces `Fonts::bundled` lays text out in: Ubuntu, Hack and three Noto
# fallbacks, 4.9 MB. Without it the host gives its own with `set_fonts`.
bundled-fonts = ["limn-core/bundled-fonts", "limn-components/bundled-fonts"]
# Tree-sitter highlighting. Without it code views fall back to the line lexer.
syntax = ["limn-core/syntax", "limn-components/syntax"]
# Hot reload under `dx serve --hot-patch`; see `limn::hot`. Development only.
hot = ["limn-core/hot"]

[dependencies]
limn-core = { version = "0.1.43", path = "../limn-core", default-features = false }
limn-components = { version = "0.1.43", path = "../limn-components", default-features = false }

# The integration tests build buffers and read the clock as the old single
# crate's did, through its dependencies.
[dev-dependencies]
limn-editor = { version = "0.1.43", path = "../limn-editor" }
web-time = "1.1"
